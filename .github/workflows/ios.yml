name: iOS validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Project validation
        run: python3 scripts/validate_project.py --swiftc "$(xcrun --find swiftc)"
      - name: Build app and XCTest target with Apple SDK
        run: >-
          xcodebuild -project Forge.xcodeproj -scheme Forge
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug CODE_SIGNING_ALLOWED=NO build-for-testing
